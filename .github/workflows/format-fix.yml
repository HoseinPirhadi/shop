name: Temporary formatter

on:
  push:
    branches:
      - tmp/format-fix

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/format-fix
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:fix
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CATALOG.md resources/js/components/store/ProductListing.vue
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply project formatter"
          git push origin HEAD:tmp/format-fix
